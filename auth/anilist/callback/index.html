<!DOCTYPE html>
<html>
  <head>
    <title>AniList Login</title>
  </head>
  <body>
    <h2>Logging you in…</h2>

    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");

      if (!code) {
        document.body.innerHTML = "<h3>No code received</h3>";
      } else {
        fetch("https://antrack-auth.ardhendu-tech.workers.dev", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ code }),
        })
          .then((res) => res.json())
          .then((data) => {
            localStorage.setItem("anilist_token", data.access_token);

            // OPTIONAL: redirect back to main app
            window.location.href = "/antrack/";
          })
          .catch(() => {
            document.body.innerHTML = "<h3>Login failed</h3>";
          });
      }
    </script>
  </body>
</html>
