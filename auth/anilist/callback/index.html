<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AniList Login</title>
  </head>
  <body>
    <h2>Logging you in…</h2>

    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");

      if (!code) {
        document.body.innerHTML = "<h3>No code received</h3>";
      } else {
        fetch("https://antrack-auth.ardhendu-tech.workers.dev", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ code }),
        })
          .then((res) => res.json())
          .then((data) => {
            console.log("AniList Token:", data);

            // Save token
            localStorage.setItem("anilist_token", data.access_token);

            document.body.innerHTML = "<h2>Login successful 🎉</h2>";
          })
          .catch((err) => {
            console.error(err);
            document.body.innerHTML = "<h3>Login failed</h3>";
          });
      }
    </script>
  </body>
</html>
